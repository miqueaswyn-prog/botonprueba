<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Por voz</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Arial,sans-serif;color:#1b2230;background:#fff;display:flex;flex-direction:column;align-items:center;padding:0 20px 24px;text-align:center}
header{align-self:stretch;margin:0 -20px;background:#1F3864;color:#fff;font-size:22px;font-weight:700;padding:16px}
#centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;width:100%}
#b{width:190px;height:190px;border-radius:50%;border:0;background:#1F3864;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-shadow:0 8px 22px rgba(31,56,100,.35)}
#b svg{width:92px;height:92px;fill:#fff;pointer-events:none}
#b.on{background:#B3261E;transform:scale(1.1);box-shadow:0 0 0 18px rgba(179,38,30,.18)}
#e{font-size:23px;font-weight:600;min-height:62px}
#t{font-size:18px;color:#5B6575;min-height:48px;width:100%}
#c{display:none;width:100%;padding:14px;border:1px solid #1F3864;background:#fff;color:#1F3864;border-radius:10px;font-size:17px;font-weight:600}
</style></head><body>
<header>Por voz</header>
<div id="centro">
<div id="e">Mantené apretado y hablá</div>
<button id="b" aria-label="Micrófono: mantené apretado y hablá"><svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5a1 1 0 0 0-2 0 4 4 0 0 1-8 0 1 1 0 0 0-2 0 6 6 0 0 0 5 5.9V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.6a6 6 0 0 0 5-5.9z"/></svg></button>
<div id="t"></div>
<button id="c">Copiar el texto</button>
</div>
<script>
var $=function(i){return document.getElementById(i)},S=window.SpeechRecognition||window.webkitSpeechRecognition;
var b=$("b"),rec=null,activo=false,apretado=false,pendiente=false,base="",parcial="",app=null,origenApp="";
function aviso(x){$("e").textContent=x}
function pintar(){$("t").textContent=(base+" "+parcial).trim()}
// El texto solo se le manda a la app de Google que abrió esta ventana.
try{var o=new URLSearchParams(location.search).get("app");if(o&&/\.googleusercontent\.com$/.test(new URL(o).hostname)&&window.opener){app=window.opener;origenApp=new URL(o).origin}}catch(z){}
function arrancar(){
  if(!S){aviso("Este navegador no reconoce la voz");return}
  if(activo){pendiente=true;return}
  activo=true;rec=new S();rec.lang="es-AR";rec.continuous=true;rec.interimResults=true;
  rec.onresult=function(v){var p="";for(var i=v.resultIndex;i<v.results.length;i++){if(v.results[i].isFinal)base=(base+" "+v.results[i][0].transcript).trim();else p+=v.results[i][0].transcript}parcial=p;pintar()};
  rec.onerror=function(v){if(v.error==="not-allowed"||v.error==="service-not-allowed")aviso("Falta dar permiso al micrófono");else if(v.error!=="aborted"&&v.error!=="no-speech")aviso("No se pudo escuchar. Probá de nuevo")};
  rec.onend=function(){activo=false;if(parcial){base=(base+" "+parcial).trim();parcial=""}pintar();
    if(apretado||pendiente){pendiente=false;arrancar();return}
    entregar()};
  try{rec.start()}catch(z){activo=false;aviso("Probá de nuevo")}
}
function entregar(){
  var txt=base.trim();
  if(!txt){if($("e").textContent==="Un momento...")aviso("No te escuché. Probá de nuevo");return}
  if(app){try{app.postMessage({repartoTexto:txt},origenApp);aviso("Listo");window.close();return}catch(z){}}
  $("c").style.display="block";aviso("Copiá el texto y pegalo en la app");
}
function apretar(v){v.preventDefault();apretado=true;b.classList.add("on");aviso("Te escucho... soltá para terminar");arrancar()}
function soltar(){if(!apretado)return;apretado=false;b.classList.remove("on");aviso("Un momento...");if(rec&&activo)rec.stop();else entregar()}
b.addEventListener("touchstart",apretar,{passive:false});b.addEventListener("touchend",soltar);b.addEventListener("touchcancel",soltar);
b.addEventListener("mousedown",apretar);addEventListener("mouseup",soltar);b.addEventListener("contextmenu",function(v){v.preventDefault()});
$("c").addEventListener("click",function(){navigator.clipboard.writeText(base.trim()).then(function(){aviso("Copiado")})});
</script></body></html>
